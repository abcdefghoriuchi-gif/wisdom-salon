<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一般社団法人 知のエグゼクティブサロン | Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ea;
    --paper-deep: #f1ead9;
    --ink: #2b2722;
    --ink-soft: #6b6258;
    --gold: #a9824a;
    --gold-soft: #c9aa72;
  }

- {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  }

html, body {
height: 100%;
}

body {
font-family: “Noto Serif JP”, serif;
background: radial-gradient(ellipse at 50% 30%, var(–paper-deep) 0%, var(–paper) 70%);
color: var(–ink);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 32px;
-webkit-font-smoothing: antialiased;
}

.card {
width: 100%;
max-width: 560px;
text-align: center;
display: flex;
flex-direction: column;
align-items: center;
animation: rise 1.1s ease-out;
}

@keyframes rise {
from { opacity: 0; transform: translateY(14px); }
to   { opacity: 1; transform: translateY(0); }
}

/* 円相 (ensō) — the single signature mark */
.enso {
width: 84px;
height: 84px;
margin-bottom: 40px;
}

.enso circle {
fill: none;
stroke: var(–gold);
stroke-width: 2.5;
stroke-linecap: round;
stroke-dasharray: 252;
stroke-dashoffset: 18;
transform: rotate(-108deg);
transform-origin: 50% 50%;
}

.eyebrow {
font-family: “Cormorant Garamond”, serif;
font-style: italic;
font-size: 0.95rem;
letter-spacing: 0.32em;
text-transform: uppercase;
color: var(–gold);
margin-bottom: 18px;
}

h1 {
font-size: clamp(1.5rem, 5vw, 2.1rem);
font-weight: 600;
line-height: 1.6;
letter-spacing: 0.04em;
}

.sub {
font-family: “Cormorant Garamond”, serif;
font-size: 1.05rem;
font-weight: 400;
letter-spacing: 0.18em;
color: var(–ink-soft);
margin-top: 8px;
text-transform: uppercase;
}

.divider {
width: 1px;
height: 56px;
background: linear-gradient(to bottom, var(–gold-soft), transparent);
margin: 40px 0;
}

.message {
font-size: 1.05rem;
line-height: 2;
color: var(–ink);
}

.date {
margin-top: 28px;
font-family: “Cormorant Garamond”, serif;
font-size: 1.15rem;
letter-spacing: 0.06em;
color: var(–gold);
}

.date span {
font-family: “Noto Serif JP”, serif;
color: var(–ink);
}

footer {
margin-top: 64px;
font-size: 0.78rem;
letter-spacing: 0.08em;
color: var(–ink-soft);
line-height: 1.9;
}

footer a {
color: var(–ink-soft);
text-decoration: none;
border-bottom: 1px solid var(–gold-soft);
transition: color 0.2s ease, border-color 0.2s ease;
}

footer a:hover,
footer a:focus-visible {
color: var(–ink);
border-color: var(–gold);
}

@media (prefers-reduced-motion: reduce) {
.card { animation: none; }
}
</style>

</head>
<body>
  <main class="card">
    <svg class="enso" viewBox="0 0 90 90" aria-hidden="true">
      <circle cx="45" cy="45" r="40" />
    </svg>

<p class="eyebrow">Salon of Wisdom</p>

<h1>一般社団法人<br>知のエグゼクティブサロン</h1>
<p class="sub">Coming Soon</p>

<div class="divider"></div>

<p class="message">
  ウェブサイトは現在準備中です。<br>
  公開まで、しばらくお待ちください。
</p>

<p class="date"><span>2026年7月1日</span> 設立</p>

<footer>
  お問い合わせ<br>
  <a href="mailto:info@wisdom-salon.jp">info@wisdom-salon.jp</a>
</footer>

  </main>
</body>
</html>
